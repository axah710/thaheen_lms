name: thaheen_lms
description: "Mini Offline LMS with Video Player for Thaheen"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  video_player: ^2.8.2
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  either_dart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3
  bloc_test: ^9.1.5
  video_player_platform_interface: ^6.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/videos/
    - assets/images/
